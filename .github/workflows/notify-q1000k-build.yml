name: Trigger Q1000K firmware build

on:
  push:
    branches: [q1000k-dev]
  workflow_dispatch:

# The dispatch token is the only credential used here; this workflow does not
# need access to the source repository's contents.
permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the matching source commit to q1000k-build
        env:
          DISPATCH_TOKEN: ${{ secrets.Q1000K_BUILD_DISPATCH_TOKEN }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::Set Q1000K_BUILD_DISPATCH_TOKEN before enabling automatic builds."
            exit 1
          fi

          payload=$(jq -nc \
            --arg ref "$SOURCE_REF" \
            --arg sha "$SOURCE_SHA" \
            '{event_type: "openwrt-q1000k-updated", client_payload: {ref: $ref, sha: $sha}}')

          curl --fail-with-body --retry 3 --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --data "$payload" \
            https://api.github.com/repos/lightingghost/q1000k-build/dispatches
